<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Atalaseen akatsak</title><desc id="desc">AVISO: 9 FN eta 12 FP; CRITICA: 14 FN eta 0 FP; F2: 9 FN eta 9 FP. Baliozkotze berrerabilia, 1200 behaketa.</desc><rect width="1000" height="480" fill="#f5f8fb"/><g font-family="Arial,sans-serif" fill="#153247"><text x="35" y="40" font-size="24" font-weight="bold">Politika bakoitzaren errore-trukea</text><text x="35" y="70" font-size="17">1.200 behaketa · 41 positibo · baliozkotze berrerabilia</text><text x="35" y="138" font-size="19">AVISO ≥0,15</text><rect x="260" y="110" width="360" height="24" rx="3" fill="#bd5c37"/><text x="635" y="129" font-size="18">9</text><rect x="260" y="142" width="480" height="24" rx="3" fill="#397e9b"/><text x="755" y="161" font-size="18">12</text><text x="35" y="238" font-size="19">CRITICA ≥0,70</text><rect x="260" y="210" width="560" height="24" rx="3" fill="#bd5c37"/><text x="835" y="229" font-size="18">14</text><rect x="260" y="242" width="0" height="24" rx="3" fill="#397e9b"/><text x="275" y="261" font-size="18">0</text><text x="35" y="338" font-size="19">F2 esploratzailea</text><rect x="260" y="310" width="360" height="24" rx="3" fill="#bd5c37"/><text x="635" y="329" font-size="18">9</text><rect x="260" y="342" width="360" height="24" rx="3" fill="#397e9b"/><text x="635" y="361" font-size="18">9</text><rect x="260" y="425" width="24" height="18" fill="#bd5c37"/><text x="294" y="441" font-size="17">FN: omititutako positiboak</text><rect x="590" y="425" width="24" height="18" fill="#397e9b"/><text x="624" y="441" font-size="17">FP: alarma faltsuak</text></g></svg>