<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><style>text{font-family:Arial,sans-serif;fill:#153247} .label{font-size:18px;font-weight:700}.sub{font-size:15px} rect{rx:10}</style><title id="title">CNC Guard arkitektura</title><desc id="desc">SMB eta Filebeat, Kafka, NiFi bidez programatutako worker-a, FastAPI eta helmuga iraunkorrak. Pertsonak erabakitzen du.</desc><rect width="1000" height="580" fill="#f5f8fb"/><text x="35" y="40" font-size="24" font-weight="700">Ingesta, inferentzia eta erabakiaren mugak</text><rect x="35" y="80" width="280" height="85" fill="white" stroke="#8da6bb"/><text class="label" x="50" y="112">SMB / CSV</text><text class="sub" x="50" y="138">jatorriaren byteak</text><rect x="355" y="80" width="280" height="85" fill="white" stroke="#8da6bb"/><text class="label" x="370" y="112">Filebeat → Kafka</text><text class="sub" x="370" y="138">registry eta offset-ak</text><rect x="355" y="210" width="280" height="85" fill="white" stroke="#8da6bb"/><text class="label" x="370" y="242">NiFi → worker</text><text class="sub" x="370" y="268">offset-aren jabe bakarra</text><rect x="35" y="340" width="280" height="85" fill="white" stroke="#8da6bb"/><text class="label" x="50" y="372">FastAPI · RF / IF</text><text class="sub" x="50" y="398">ledger kanonikoa</text><rect x="355" y="340" width="280" height="85" fill="white" stroke="#8da6bb"/><text class="label" x="370" y="372">CG15 · Parquet</text><text class="sub" x="370" y="398">raw + prediction</text><rect x="675" y="340" width="280" height="85" fill="white" stroke="#8da6bb"/><text class="label" x="690" y="372">Elasticsearch</text><text class="sub" x="690" y="398">mapping / final pipeline</text><rect x="675" y="470" width="280" height="85" fill="white" stroke="#8da6bb"/><text class="label" x="690" y="502">Kibana → pertsona</text><text class="sub" x="690" y="528">ikuskapen-proposamena</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#4d6e84"/></marker></defs><path d="M315 122 H350" fill="none" stroke="#4d6e84" stroke-width="3" marker-end="url(#a)"/><path d="M495 165 V205" fill="none" stroke="#4d6e84" stroke-width="3" marker-end="url(#a)"/><path d="M355 252 H175 V335" fill="none" stroke="#4d6e84" stroke-width="3" marker-end="url(#a)"/><path d="M495 295 V335" fill="none" stroke="#4d6e84" stroke-width="3" marker-end="url(#a)"/><path d="M635 252 H815 V335" fill="none" stroke="#4d6e84" stroke-width="3" marker-end="url(#a)"/><path d="M815 425 V465" fill="none" stroke="#4d6e84" stroke-width="3" marker-end="url(#a)"/><text class="sub" x="35" y="490">Commit-a: API + artxiboa + ES ondoren.</text><text class="sub" x="35" y="520">Ez dago CNC / PLCrako agindurik.</text><text class="sub" x="35" y="550">Geziek ardura logikoak erakusten dituzte.</text></svg>