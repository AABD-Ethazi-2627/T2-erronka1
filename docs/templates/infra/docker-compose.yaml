# Historical classroom example; see docs/REPOSITORY_LAYOUT.md.
# docker-compose.yml — IKASLE VM-ERAKO
# Simuladorea ZERBITZARI NAGUSIAN dago; honetatik NFS bidez irakurtzen du Filebeat-ek.
# Validar sin iniciar: python3 scripts/check_lab_compose.py (desde la raíz).

services:

  # ── Kafka — Mezularitza bufferra (KRaft mode, zookeeper gabe) ────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: cnc-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    restart: unless-stopped

  # ── Filebeat — CSV fitxategien irakurlea ─────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: cnc-filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${CNC_STREAM_DIR:?Set CNC_STREAM_DIR to a local mounted directory}:/mnt/cnc-stream:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - kafka
    restart: unless-stopped

  # ── Apache NiFi — Transformazioa eta bideratzea ──────────────────────────────
  nifi:
    image: apache/nifi:1.25.0
    container_name: cnc-nifi
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ${CNC_NIFI_PASSWORD:?Set CNC_NIFI_PASSWORD for this lab}
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_PROXY_HOST: "localhost:8443,127.0.0.1:8443"
    restart: unless-stopped

  # ── Elasticsearch — Biltegiratze eta bilaketa ────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cnc-elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ── Kibana — Bistaratzea ─────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: cnc-kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ── Scoring API — ML inferentzia (3. fasea) ──────────────────────────────────
  scoring-api:
    build:
      context: ./scoring
    container_name: cnc-scoring
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../../../models:/models:ro
    environment:
      MODEL_PATH: /models/cnc_failure_model.pkl
    restart: unless-stopped

volumes:
  filebeat-data:
  es-data:
