name: cnc-guard-cg14

services:
  nifi:
    image: apache/nifi:2.12.0@sha256:6f7f2840dbf178c6dd3fa13435b9b358f3be3c6fb7417de467a35a267f4d28ad
    container_name: cnc-cg14-nifi
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: ${NIFI_WEB_HTTPS_PORT:-8443}
      NIFI_WEB_PROXY_HOST: "localhost:${CG14_HOST_PORT:-18443},127.0.0.1:${CG14_HOST_PORT:-18443},localhost:${NIFI_WEB_HTTPS_PORT:-8443}"
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT:-1g}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX:-2g}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:?Run scripts/init-secrets.sh first}
      SINGLE_USER_CREDENTIALS_USERNAME: ${SINGLE_USER_CREDENTIALS_USERNAME:?Run scripts/init-secrets.sh first}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${SINGLE_USER_CREDENTIALS_PASSWORD:?Run scripts/init-secrets.sh first}
    ports:
      - "127.0.0.1:${CG14_HOST_PORT:-18443}:${NIFI_WEB_HTTPS_PORT:-8443}"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./data/dlq:/opt/nifi/cg14-dlq
    mem_limit: ${NIFI_MEM_LIMIT:-5g}
    cpus: ${NIFI_CPUS:-3.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - cg14
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --insecure --silent --show-error --fail https://localhost:$${NIFI_WEB_HTTPS_PORT}/nifi/ >/dev/null"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mock-predict:
    image: python:3.13.17-alpine3.23@sha256:85c3e958f9448b4c75069957f1f6a3be5325e8ea7ad1f205142fc9d023d0531b
    container_name: cnc-cg14-mock-predict
    profiles: [integration-mocks]
    restart: "no"
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    command: ["python", "-u", "/app/mock_predict.py"]
    volumes:
      - ./scripts/mock_predict.py:/app/mock_predict.py:ro
    networks:
      - cg14
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-test:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    container_name: cnc-cg14-kafka-test
    hostname: cg14-kafka-test
    profiles: [kafka-test]
    restart: "no"
    read_only: true
    entrypoint: ["/bin/bash", "/lab/start.sh"]
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CLUSTER_ID: "CG14testKRaftCluster01"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@cg14-kafka-test:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cg14-kafka-test:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
      TMPDIR: /lab/runtime
      TEMP: /lab/runtime
      TMP: /lab/runtime
      LOG_DIR: /lab/runtime/logs
      KAFKA_OPTS: "-Djava.io.tmpdir=/lab/runtime -XX:-UsePerfData"
    volumes:
      - ./data/kafka-test:/var/lib/kafka
      - ./data/kafka-test/data:/var/lib/kafka/data
      - ./data/kafka-secrets:/etc/kafka/secrets:ro
      - ./data/kafka-shared-config:/mnt/shared/config:ro
      - ./data/kafka-runtime:/lab/runtime
      - ./scripts/kafka-volume.properties:/lab/server.properties:ro
      - ./scripts/kafka-volume-start.sh:/lab/start.sh:ro
    networks:
      - cg14
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cg14:
    name: cg14-nifi
    driver: bridge

volumes:
  nifi_conf:
    name: cg14-nifi-conf
  nifi_state:
    name: cg14-nifi-state
  nifi_database:
    name: cg14-nifi-database
  nifi_flowfile:
    name: cg14-nifi-flowfile
  nifi_content:
    name: cg14-nifi-content
  nifi_provenance:
    name: cg14-nifi-provenance
