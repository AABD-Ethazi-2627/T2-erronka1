name: cnc-guard-cg14

services:
  nifi:
    image: apache/nifi:${NIFI_VERSION:-2.12.0}
    container_name: cnc-cg14-nifi
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: ${NIFI_WEB_HTTPS_PORT:-8443}
      NIFI_WEB_PROXY_HOST: "localhost:${CG14_HOST_PORT:-18443},127.0.0.1:${CG14_HOST_PORT:-18443},localhost:${NIFI_WEB_HTTPS_PORT:-8443}"
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT:-1g}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX:-2g}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:?Run scripts/init-secrets.sh first}
      SINGLE_USER_CREDENTIALS_USERNAME: ${SINGLE_USER_CREDENTIALS_USERNAME:?Run scripts/init-secrets.sh first}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${SINGLE_USER_CREDENTIALS_PASSWORD:?Run scripts/init-secrets.sh first}
    ports:
      - "127.0.0.1:${CG14_HOST_PORT:-18443}:${NIFI_WEB_HTTPS_PORT:-8443}"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./data/dlq:/opt/nifi/cg14-dlq
    mem_limit: ${NIFI_MEM_LIMIT:-5g}
    cpus: ${NIFI_CPUS:-3.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - cg14
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --insecure --silent --show-error --fail https://localhost:$${NIFI_WEB_HTTPS_PORT}/nifi/ >/dev/null"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mock-predict:
    image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    container_name: cnc-cg14-mock-predict
    profiles: [integration-mocks]
    restart: "no"
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    command: ["python", "-u", "/app/mock_predict.py"]
    volumes:
      - ./scripts/mock_predict.py:/app/mock_predict.py:ro
    networks:
      - cg14
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-test:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: cnc-cg14-kafka-test
    hostname: cg14-kafka-test
    profiles: [kafka-test]
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CLUSTER_ID: "CG14testKRaftCluster01"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@cg14-kafka-test:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cg14-kafka-test:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - ./data/kafka-test:/tmp/kraft-combined-logs
    networks:
      - cg14
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cg14:
    name: cg14-nifi
    driver: bridge

volumes:
  nifi_conf:
    name: cg14-nifi-conf
  nifi_state:
    name: cg14-nifi-state
  nifi_database:
    name: cg14-nifi-database
  nifi_flowfile:
    name: cg14-nifi-flowfile
  nifi_content:
    name: cg14-nifi-content
  nifi_provenance:
    name: cg14-nifi-provenance
