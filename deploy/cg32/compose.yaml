# CG32 private load lab: own project, own binds, loopback-only random ports.
# Started only through scripts/cg32_lab.py, which fixes CG32_* paths first.
# No shared broker, SMB, history or restart policy. Kibana only for Discover.
name: ${CG32_PROJECT:?set by cg32_lab.py}

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: 'no'
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '2'}

services:
  kafka:
    <<: *hardening
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    user: '1000:1000'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,HOST://:9092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://127.0.0.1:${CG32_KAFKA_PORT:?}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # Same as the accepted CG14/CG20 broker: bounded cycles join immediately.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    # HOST listener: read-only observation (lag, topic dump) from the driver.
    ports: ['127.0.0.1:${CG32_KAFKA_PORT:?}:9092']
    volumes: ['${CG32_LAB}/kafka:/var/lib/kafka/data']
    mem_limit: 768m
    cpus: 1.5

  filebeat:
    <<: *hardening
    image: docker.elastic.co/beats/filebeat:9.5.5@sha256:4b2042fcbeb781800bc7271d400f764bb7d670310dfd4fe03ade53d6c7ab78aa
    user: '1000:1000'
    command: [filebeat, -e, --strict.perms=false, -c, '/lab/runs/${CG32_RUN:-none}/filebeat.yml', --path.data, '/lab/runs/${CG32_RUN:-none}/filebeat-data']
    volumes:
      - '${CG32_LAB}/runs:/lab/runs'
    depends_on: [kafka]
    mem_limit: 256m
    cpus: 0.5
    profiles: [run]

  elasticsearch:
    <<: *hardening
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    user: '1000:0'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.watermark.low: 4gb
      cluster.routing.allocation.disk.watermark.high: 2gb
      cluster.routing.allocation.disk.watermark.flood_stage: 1gb
    ports: ['127.0.0.1::9200']
    volumes: ['${CG32_LAB}/es:/usr/share/elasticsearch/data']
    mem_limit: 1200m
    cpus: 2

  kibana:
    <<: *hardening
    image: docker.elastic.co/kibana/kibana:9.5.5@sha256:13b72ce7222c36e4213229004ae62a87aeb32fd372ebfa6fb38f7a3285fdbb78
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: 'false'
      TELEMETRY_ALLOWCHANGINGOPTIN: 'false'
      NODE_OPTIONS: --max-old-space-size=1024
    ports: ['127.0.0.1::5601']
    depends_on: [elasticsearch]
    mem_limit: 1600m
    cpus: 1
    profiles: [dashboard]

  api:
    <<: *hardening
    # Real API app + pinned bundle (read-only) + server-side timing log per run.
    # glibc base so the host uv interpreter/venv can be mounted read-only.
    image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
    user: '1000:1000'
    working_dir: ${CG32_REPO}
    environment:
      PYTHONPATH: ${CG32_REPO}
      PYTHONDONTWRITEBYTECODE: '1'
    command:
      - ${CG32_REPO}/.venv/bin/python
      - ${CG32_REPO}/deploy/cg32/api_server.py
      - /bundle/manifest.json
      - '${CG32_LAB}/runs/${CG32_RUN:-none}/api-ledger.sqlite3'
      - '${CG32_LAB}/runs/${CG32_RUN:-none}/api-timing.jsonl'
      - 0.0.0.0
      - '8000'
    ports: ['127.0.0.1::8000']
    volumes:
      - '${CG32_REPO}:${CG32_REPO}:ro'
      - '${CG32_UV_PYTHON}:${CG32_UV_PYTHON}:ro'
      - '${CG32_BUNDLE:-/nonexistent}:/bundle:ro'
      - '${CG32_LAB}/runs:${CG32_LAB}/runs'
    mem_limit: 768m
    cpus: 2
    profiles: [run]

  nifi:
    <<: *hardening
    image: apache/nifi:2.12.0@sha256:6f7f2840dbf178c6dd3fa13435b9b358f3be3c6fb7417de467a35a267f4d28ad
    init: true
    user: '1000:1000'
    environment:
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: '8443'
      NIFI_WEB_PROXY_HOST: '127.0.0.1:${CG32_NIFI_PORT:?},localhost:${CG32_NIFI_PORT:?}'
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:?}
      SINGLE_USER_CREDENTIALS_USERNAME: ${SINGLE_USER_CREDENTIALS_USERNAME:?}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${SINGLE_USER_CREDENTIALS_PASSWORD:?}
    ports: ['127.0.0.1:${CG32_NIFI_PORT:?}:8443']
    volumes:
      # NiFi needs image defaults copied into its repositories: project volumes.
      # Same absolute paths as the host so the pinned graph config is valid in both.
      - '${CG32_REPO}:${CG32_REPO}:ro'
      - '${CG32_UV_PYTHON}:${CG32_UV_PYTHON}:ro'
      - '${CG32_LAB}/runs:${CG32_LAB}/runs'
      - 'nifi-conf:/opt/nifi/nifi-current/conf'
      - 'nifi-state:/opt/nifi/nifi-current/state'
      - 'nifi-database:/opt/nifi/nifi-current/database_repository'
      - 'nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository'
      - 'nifi-content:/opt/nifi/nifi-current/content_repository'
      - 'nifi-provenance:/opt/nifi/nifi-current/provenance_repository'
      - 'nifi-logs:/opt/nifi/nifi-current/logs'
    mem_limit: 2g
    cpus: 2

volumes:
  nifi-conf:
  nifi-state:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
  nifi-logs:
