# Isolated local laboratory. No container_name, external mounts or production action.
name: cnc-guard-lab
services:
  kafka-init:
    image: apache/kafka:3.7.0
    user: root
    entrypoint: [/bin/bash, -c, 'chown 1000:1000 /data']
    volumes: [kafka-data:/data]
    mem_limit: 64m
  kafka:
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    mem_limit: 640m
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.4
    user: root
    command: [filebeat, -e, --strict.perms=false]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${CNC_STREAM_DIR:-./outputs/stream}:/mnt/cnc-stream:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on: [kafka]
    mem_limit: 192m
  nifi:
    image: ${NIFI_IMAGE:-iabd-nifi:2.0.0-local}
    environment:
      NIFI_WEB_HTTPS_PORT: '8443'
      NIFI_WEB_HTTPS_HOST: '0.0.0.0'
      NIFI_WEB_PROXY_HOST: '127.0.0.1:18080,localhost:18080'
      NIFI_JVM_HEAP_INIT: 384m
      NIFI_JVM_HEAP_MAX: 768m
    ports: ['127.0.0.1:18080:8443']
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-flowfiles:/opt/nifi/nifi-current/flowfile_repository
    mem_limit: 1200m
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    ports: ['127.0.0.1:19200:9200']
    volumes: [es-data:/usr/share/elasticsearch/data]
    mem_limit: 800m
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=512
    ports: ['127.0.0.1:15601:5601']
    depends_on: [elasticsearch]
    mem_limit: 800m
    profiles: [dashboard]
  scoring-api:
    build:
      context: .
      dockerfile: scoring/Dockerfile
    environment:
      MODEL_MANIFEST: /models/manifest.json
    ports: ['127.0.0.1:18001:8000']
    volumes: ['./outputs/api:/models:ro']
    mem_limit: 512m
volumes:
  kafka-data:
  filebeat-data:
  nifi-conf:
  nifi-state:
  nifi-content:
  nifi-flowfiles:
  es-data:
