# Isolated local laboratory. No container_name, external mounts or production action.
name: cnc-guard-lab-v2
services:
  kafka-init:
    build:
      context: .
      dockerfile: deploy/images/kafka.Dockerfile
    user: root
    entrypoint: [/bin/bash, -c, 'chown 1000:1000 /data']
    volumes: [kafka-data:/data]
    mem_limit: 64m
  kafka:
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: deploy/images/kafka.Dockerfile
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    mem_limit: 640m
  filebeat:
    image: docker.elastic.co/beats/filebeat-wolfi:9.5.5@sha256:b644d58f79f2a53b46ce558efa706a51ba211e0d0f89352bfe33b3973958e3eb
    user: root
    command: [filebeat, -e, --strict.perms=false]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${CNC_STREAM_DIR:-./outputs/stream}:/mnt/cnc-stream:ro
      - ${CNC_SMB_CAPTURE_DIR:-./outputs/smb-stream}:/mnt/cnc-smb:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on: [kafka]
    mem_limit: 192m
  nifi:
    image: apache/nifi:2.12.0@sha256:6f7f2840dbf178c6dd3fa13435b9b358f3be3c6fb7417de467a35a267f4d28ad
    environment:
      NIFI_WEB_HTTPS_PORT: '8443'
      NIFI_WEB_HTTPS_HOST: '0.0.0.0'
      NIFI_WEB_PROXY_HOST: '127.0.0.1:18080,localhost:18080'
      NIFI_JVM_HEAP_INIT: 384m
      NIFI_JVM_HEAP_MAX: 768m
    ports: ['127.0.0.1:18080:8443']
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-flowfiles:/opt/nifi/nifi-current/flowfile_repository
    mem_limit: 1200m
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.5.5@sha256:c2cce72acf8dc0510c04fd5926123f630859019082edf9827daef82b6a46c9c1
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms384m -Xmx384m
      cluster.routing.allocation.disk.watermark.low: 4gb
      cluster.routing.allocation.disk.watermark.high: 2gb
      cluster.routing.allocation.disk.watermark.flood_stage: 1gb
    ports: ['127.0.0.1:19200:9200']
    volumes: [es-data:/usr/share/elasticsearch/data]
    mem_limit: 800m
  kibana:
    image: docker.elastic.co/kibana/kibana-wolfi:9.5.5@sha256:46b0a3adf85186f9153fbd322e55ea8f70bc4039dcd55d58826fc1caa372dee5
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: 'false'
      TELEMETRY_ALLOWCHANGINGOPTIN: 'false'
      NODE_OPTIONS: --max-old-space-size=1024
    ports: ['127.0.0.1:15601:5601']
    depends_on: [elasticsearch]
    mem_limit: 1600m
    profiles: [dashboard]
  scoring-api:
    build:
      context: .
      dockerfile: scoring/Dockerfile
    environment:
      MODEL_MANIFEST: /models/manifest.json
      SCORING_LEDGER: /state/responses.sqlite3
    ports: ['127.0.0.1:18001:8000']
    volumes: ['./outputs/api:/models:ro', 'scoring-state:/state']
    mem_limit: 512m
    read_only: true
    tmpfs: ['/tmp:rw,size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
volumes:
  kafka-data:
  filebeat-data:
  nifi-conf:
  nifi-state:
  nifi-content:
  nifi-flowfiles:
  es-data:
  scoring-state:
