global
    log stdout format raw local0
    maxconn 128
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend nifi_lan
    bind :18080 ssl crt /certs/server.pem ca-file /certs/clients-ca.pem verify required
    default_backend nifi_internal

backend nifi_internal
    server nifi nifi:8443 ssl verify required ca-file /certs/nifi-ca.pem verifyhost "$CNC_NIFI_CERT_NAME" sni str("$CNC_NIFI_CERT_NAME") check

frontend kafka_lan
    bind :19092 ssl crt /certs/server.pem ca-file /certs/clients-ca.pem verify required
    timeout client 1h
    default_backend kafka_external

backend kafka_external
    timeout server 1h
    server kafka kafka:19092 check

frontend elasticsearch_lan
    bind :19200 ssl crt /certs/server.pem ca-file /certs/clients-ca.pem verify required
    default_backend elasticsearch_internal

backend elasticsearch_internal
    server elasticsearch elasticsearch:9200 check

frontend kibana_lan
    bind :15601 ssl crt /certs/server.pem ca-file /certs/clients-ca.pem verify required
    default_backend kibana_internal

backend kibana_internal
    server kibana kibana:5601 check

frontend scoring_lan
    bind :18001 ssl crt /certs/server.pem ca-file /certs/clients-ca.pem verify required
    default_backend scoring_internal

backend scoring_internal
    server scoring scoring-api:8000 check
