# Optional LAN access for four students. Supply server IP/host and private certs.
# Use with: docker compose -f docker-compose.yml -f docker-compose.lan.yml --profile dashboard up -d
services:
  kafka:
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${CNC_LAN_HOST:?Set the server LAN hostname or IP}:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  nifi:
    environment:
      NIFI_WEB_PROXY_HOST: '${CNC_LAN_HOST:?Set the server LAN hostname or IP}:18080,localhost:18080,127.0.0.1:18080'
  lan-gateway:
    image: haproxy:3.2-alpine@sha256:5893840576071e6217cd52ebdcc14f454c6f7a631056fa6f4e0f40d3cac4215b
    user: '${CNC_LAN_CERT_UID:?Set id -u}:${CNC_LAN_CERT_GID:?Set id -g}'
    environment:
      CNC_NIFI_CERT_NAME: ${CNC_NIFI_CERT_NAME:?Set the verified NiFi certificate hostname}
    depends_on: [kafka, elasticsearch, kibana, scoring-api]
    volumes:
      - ./lan/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${CNC_LAN_CERT_DIR:?Set the private LAN certificate directory}:/certs:ro
    ports:
      - '${CNC_LAN_BIND_IP:?Set the server LAN interface IP}:18080:18080'
      - '${CNC_LAN_BIND_IP:?Set the server LAN interface IP}:19092:19092'
      - '${CNC_LAN_BIND_IP:?Set the server LAN interface IP}:19200:19200'
      - '${CNC_LAN_BIND_IP:?Set the server LAN interface IP}:15601:15601'
      - '${CNC_LAN_BIND_IP:?Set the server LAN interface IP}:18001:18001'
    mem_limit: 128m
