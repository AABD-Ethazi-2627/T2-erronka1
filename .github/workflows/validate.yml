name: Validate CNC Guard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install locked environment
        run: |
          python3 -m pip install uv==0.13.1
          uv sync --frozen --python 3.11 --extra kafka
      - name: Generate own model bundle for API acceptance tests
        run: |
          uv run --frozen --extra kafka python -m scripts.experiment_rf
          uv run --frozen --extra kafka python -m scripts.experiment_anomaly
          uv run --frozen --extra kafka python -m scripts.package_model
      - name: CG14 hermetic regression tests
        run: uv run --frozen --extra kafka python -m pytest -q tests/test_cg14_*.py
      - name: Unit tests and immutable source audit
        run: |
          uv run --frozen --extra kafka python -m unittest discover -s tests -v
          uv run --frozen --extra kafka python -m scripts.audit_cg02 --check
          git diff --exit-code
