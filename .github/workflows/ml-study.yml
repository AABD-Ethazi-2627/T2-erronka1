name: ML research smoke
on:
  pull_request:
    paths:
      - 'scripts/*ml_study*'
      - 'tests/research/**'
      - '.github/workflows/ml-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false
      - name: Install separate research environment
        run: |
          uv venv --python 3.12 /tmp/cncguard-research
          uv pip sync --python /tmp/cncguard-research/bin/python scripts/ml_study_requirements.txt
      - name: Test protocol and every adapter with synthetic fixtures only
        run: |
          /tmp/cncguard-research/bin/python -m unittest discover -s tests/research -v
          /tmp/cncguard-research/bin/python -m scripts.ml_study smoke --output /tmp/cncguard-research-smoke
