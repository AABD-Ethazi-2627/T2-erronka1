name: ML research smoke
on:
  pull_request:
    paths:
      - 'scripts/ml_study*'
      - 'scripts/report_ml_study.py'
      - 'tests/research/**'
      - '.github/workflows/ml-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install separate research environment
        run: |
          python3 -m pip install uv==0.13.1
          uv venv --python 3.12 /tmp/cncguard-research
          uv pip sync --python /tmp/cncguard-research/bin/python scripts/ml_study_requirements.txt
      - name: Test protocol and every adapter with synthetic fixtures only
        run: |
          /tmp/cncguard-research/bin/python -m unittest discover -s tests/research -v
          /tmp/cncguard-research/bin/python -m scripts.ml_study smoke --output /tmp/cncguard-research-smoke
