name: Dependency audit
on:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.11'
          enable-cache: false
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1
      - name: Validate lock, runtime hashes and infrastructure inventory
        run: |
          uv lock --check
          python3 -m scripts.export_runtime --check
          python3 -m scripts.image_inventory --check
          python3 -m scripts.build_refreshed_lab_flow --check
          python3 scripts/check_lab_compose.py
      - name: Audit every lock entry and uv (lookup failures fail closed)
        run: python3 -m scripts.audit_dependencies --latest --output dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: [api, dashboard, kafka, nifi, elasticsearch, kibana, filebeat, python, mock-python, uv, go, haproxy, wolfi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select immutable reference
        id: image
        env:
          IMAGE_KEY: ${{ matrix.image }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          key = os.environ['IMAGE_KEY']
          targets = json.loads(Path('deploy/build-targets.json').read_text())
          ref = f'cnc-guard-audit:{key}' if key in targets else json.loads(Path('deploy/images.json').read_text())[key]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('ref=' + ref, file=output)
              print('dockerfile=' + targets.get(key, ''), file=output)
          PY
      - name: Build actual runtime image
        if: steps.image.outputs.dockerfile != ''
        run: docker build --file "${{ steps.image.outputs.dockerfile }}" --tag "${{ steps.image.outputs.ref }}" .
      - name: Verify offline API query under runtime limits
        if: matrix.image == 'api'
        run: python3 -m scripts.check_runtime_image "${{ steps.image.outputs.ref }}"
      - name: Verify isolated dashboard runtime offline
        if: matrix.image == 'dashboard'
        run: |
          docker run --rm --network none --read-only --memory 512m --tmpfs /tmp:rw,nosuid,nodev,size=64m "${{ steps.image.outputs.ref }}" /usr/bin/python3.12 -c "import streamlit,requests,pandas,pyarrow,matplotlib,seaborn; assert streamlit.__version__ == '1.66.1'"
      - name: Install checksum-pinned Trivy directly from GitHub Releases
        run: |
          sh scripts/install_trivy_release.sh "$RUNNER_TEMP/cnc-trivy-bin"
          printf '%s\n' "$RUNNER_TEMP/cnc-trivy-bin" >> "$GITHUB_PATH"
      - name: Preserve the complete image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.1'
          skip-setup-trivy: 'true'
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          list-all-pkgs: true
          format: json
          output: image-scan.json
          timeout: 15m
          exit-code: '0'
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          cache: false
      - name: Audit actual nested NiFi dependencies
        if: matrix.image == 'nifi'
        run: |
          docker build --file deploy/images/nifi.Dockerfile --target archive-audit --tag cnc-guard-audit:nifi-archives .
          # This GitHub-hosted job owns its Docker daemon. Intermediate Rust/uv
          # build cache is no longer needed; retain both tagged images for Trivy.
          df -h "$RUNNER_TEMP" /var/lib/docker
          docker system df
          docker builder prune --all --force
          docker image inspect --format '{{.Id}}' cnc-guard-audit:nifi cnc-guard-audit:nifi-archives
          df -h "$RUNNER_TEMP" /var/lib/docker
          trivy image --scanners vuln --format json --list-all-pkgs --timeout 15m --output nested-archive-scan.json cnc-guard-audit:nifi-archives
          python3 -m scripts.enforce_image_scan nifi-archives nested-archive-scan.json
      - name: Reject unverified image vulnerabilities
        env:
          IMAGE_KEY: ${{ matrix.image }}
        run: python3 -m scripts.enforce_image_scan "$IMAGE_KEY" image-scan.json
      - name: Prove the Filebeat Go finding is unreachable
        if: matrix.image == 'filebeat'
        run: |
          container=$(docker create "${{ steps.image.outputs.ref }}")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/share/filebeat/filebeat" /tmp/filebeat
          docker run --rm --volume /tmp/filebeat:/target/filebeat:ro golang:1.26.10-alpine3.23@sha256:0525c952defebc693cdaf62cdf43afa32be5a7f377e99260642ea19c240c708e sh -c \
            'go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /target/filebeat'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-${{ matrix.image }}
          path: |
            image-scan.json
            nested-archive-scan.json
          if-no-files-found: error
          retention-days: 30
