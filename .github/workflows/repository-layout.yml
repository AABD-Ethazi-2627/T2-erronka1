name: Repository layout
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_repository_layout.py
