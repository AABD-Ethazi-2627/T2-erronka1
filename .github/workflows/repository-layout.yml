name: Repository layout
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check_repository_layout.py
