name: Laneki prototype
on:
  pull_request:
    paths:
      - 'dashboard_laneki/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false
      - name: Install the hashed prototype environment
        run: |
          uv venv .dashboard-venv --python 3.12
          uv pip install --python .dashboard-venv/bin/python --require-hashes -r dashboard_laneki/requirements.txt
          uv pip check --python .dashboard-venv/bin/python
      - name: Validate snapshots, navigation and degraded states
        run: |
          .dashboard-venv/bin/python -W error -m unittest discover -s dashboard_laneki -p test_domain.py -v
          .dashboard-venv/bin/python -W error -m unittest discover -s dashboard_laneki -p test_app.py -v
