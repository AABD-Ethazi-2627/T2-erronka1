[project]
name = "cnc-guard-offline"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas==2.2.2",
  "numpy==1.26.4",
  "scikit-learn==1.5.0",
  "joblib==1.4.2",
  "pyarrow==23.0.1",
  "duckdb==1.2.2",
  "jsonschema==4.23.0",
  "matplotlib==3.10.1",
  "fastapi==0.133.0",
  "starlette==1.7.0",
  "uvicorn==0.30.1",
  "httpx==0.27.0",
  "imbalanced-learn==0.12.4",
]

[project.optional-dependencies]
kafka = ["kafka-python==3.0.11+cncguard.1"]

[tool.uv.sources]
kafka-python = { path = "vendor/kafka_python-3.0.11+cncguard.1-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
]
research = [
    "catboost==1.2.10",
]
