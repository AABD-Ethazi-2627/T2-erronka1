[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t2-erronka1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "joblib==1.4.2",
    "numpy==2.2.6",
    "pandas==2.2.2",
    "pydantic==2.14.1",
    "pytest==8.4.2",
    "scikit-learn==1.5.0",
    "uvicorn[standard]==0.30.1",
]

[dependency-groups]
notebook = ["ipykernel==6.30.1", "nbconvert==7.16.6", "jupyterlab==4.4.9"]

[tool.hatch.build.targets.wheel]
packages = ["cnc_guard"]
