[project]
name = "cnc-guard-offline"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas==2.2.2",
  "numpy==1.26.4",
  "scikit-learn==1.5.0",
  "joblib==1.5.3",
  "pyarrow==26.0.0",
  "duckdb==2.0.0",
  "jsonschema==4.26.0",
  "matplotlib==3.11.2",
  "fastapi==0.161.1",
  "starlette==1.9.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "imbalanced-learn==0.14.2",
]

[project.optional-dependencies]
kafka = ["kafka-python==3.0.11+cncguard.2"]

[tool.uv.sources]
kafka-python = { path = "vendor/kafka_python-3.0.11+cncguard.2-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
]
research = [
    "catboost==1.2.10",
]
# Deliberately unversioned aliases: uv resolves every group with the exact
# project pins above. Serving consumes only this group's locked closure.
runtime = [
    "fastapi", "starlette", "uvicorn", "joblib", "scikit-learn", "pandas",
    "numpy", "jsonschema",
]

# The sealed ML study has its own compiled requirements and synthetic CI job.
# Default application tests must not import that separate numerical environment.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["research"]
